<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - TVS Wholesale</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #007BFF; color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; text-align: center; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="userid" placeholder="User ID">
    <input type="password" id="password" placeholder="Password">
    <button onclick="checkLogin()">Login</button>
    <p id="errorMsg" class="error">Invalid User ID or Password!</p>
</div>

<script>
    function checkLogin() {
        let user = document.getElementById("userid").value;
        let pass = document.getElementById("password").value;

        // ডেটাবেজ চেক (আপনার শিটের তথ্য অনুযায়ী)
        if (user === "Rakib" && pass === "rakib4488") {
            localStorage.setItem("isAdminLoggedIn", "true");
            window.location.href = "admin.html";
        } else {
            document.getElementById("errorMsg").style.display = "block";
        }
    }
</script>

</body>
</html>
